{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card shadow-sm border-0 rounded-4 p-4">
      <h2 class="fw-bold mb-1">Create account</h2>
      <p class="text-muted mb-4">NYP students only — use your @nyp.edu.sg email</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} alert-dismissible fade show rounded-3" role="alert">
            {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" action="{{ url_for('register') }}">
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label fw-semibold">First Name</label>
            <input type="text" name="first_name" class="form-control rounded-3" required>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Last Name</label>
            <input type="text" name="last_name" class="form-control rounded-3" required>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Student ID</label>
            <input type="text" name="student_id" class="form-control rounded-3"
                   placeholder="e.g. 254381C" required>
          </div>
          <div class="col-6">
            <label class="form-label fw-semibold">Display Name</label>
            <input type="text" name="display_name" class="form-control rounded-3" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">NYP Email</label>
            <input type="email" name="email" class="form-control rounded-3"
                   placeholder="s123456@nyp.edu.sg" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Contact Number</label>
            <input type="text" name="contact_number" class="form-control rounded-3"
                   placeholder="9123 4567" required>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control rounded-3" required>
          </div>
          <div class="col-12 mt-2">
            <button type="submit" class="btn w-100 text-white fw-bold rounded-pill py-2"
                    style="background: linear-gradient(90deg, #8b5cf6, #ec4899);">
              Create Account
            </button>
          </div>
        </div>
      </form>

      <p class="text-center text-muted mt-3 mb-0">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="fw-semibold" style="color:#8b5cf6;">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
