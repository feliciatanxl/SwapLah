{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center mt-3">
    <div class="col-lg-10">
        <div class="page-card p-4 p-md-5 bg-white" style="border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: none;">
            <div class="d-flex align-items-center gap-3 mb-2">
                <a href="{{ url_for('index') }}" class="btn btn-light rounded-circle d-flex align-items-center justify-content-center shadow-sm" style="width: 44px; height: 44px; border: 1px solid #e5e7eb;"><i class="bi bi-arrow-left"></i></a>
                <h2 class="section-title fw-bold mb-0" style="font-size: 2.2rem; letter-spacing: -0.5px;">List an item <span class="fs-3">📦</span></h2>
            </div>
            <p class="text-muted mb-5" style="margin-left: 60px;">Takes ~2 minutes. Better photos = faster sales!</p>

            <form>
                <div class="row g-5">
                    <!-- Left Column: Photos -->
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Photos</label>
                        
                        <!-- Main upload area -->
                        <div class="d-flex flex-column align-items-center justify-content-center bg-soft-purple" style="height: 280px; border: 2px dashed #c4b5fd; border-radius: 20px; cursor: pointer; transition: 0.2s;">
                            <div class="bg-white text-purple d-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 48px; height: 48px; border-radius: 12px; font-size: 1.5rem;">
                                <i class="bi bi-upload"></i>
                            </div>
                            <h6 class="text-purple fw-bold mb-1">Tap to upload</h6>
                            <small class="text-muted">JPG / PNG · Up to 5 photos</small>
                        </div>

                        <!-- Thumbnails -->
                        <div class="d-flex gap-2 mt-3 justify-content-between">
                            <div class="bg-light d-flex align-items-center justify-content-center text-muted" style="width: 23%; height: 60px; border-radius: 12px;"><i class="bi bi-image"></i></div>
                            <div class="bg-light d-flex align-items-center justify-content-center text-muted" style="width: 23%; height: 60px; border-radius: 12px;"><i class="bi bi-image"></i></div>
                            <div class="bg-light d-flex align-items-center justify-content-center text-muted" style="width: 23%; height: 60px; border-radius: 12px;"><i class="bi bi-image"></i></div>
                            <div class="bg-light d-flex align-items-center justify-content-center text-muted" style="width: 23%; height: 60px; border-radius: 12px;"><i class="bi bi-image"></i></div>
                        </div>
                    </div>

                    <!-- Right Column: Details -->
                    <div class="col-md-7">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Title *</label>
                            <input type="text" class="form-control bg-light border-0 px-3 py-2" style="border-radius: 12px;" placeholder="e.g. Calculus 9E Textbook">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Description</label>
                            <textarea class="form-control bg-light border-0 px-3 py-2" rows="3" style="border-radius: 12px;" placeholder="Condition, defects, included accessories..."></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Category *</label>
                                <select class="form-select bg-light border-0 px-3 py-2 text-muted" style="border-radius: 12px;">
                                    <option selected>Pick one...</option>
                                    <option>Textbooks</option>
                                    <option>Electronics</option>
                                    <option>Lab Equipment</option>
                                    <option>Clothing</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-bold">Condition *</label>
                                <select class="form-select bg-light border-0 px-3 py-2 text-muted" style="border-radius: 12px;">
                                    <option selected>Pick one...</option>
                                    <option>New</option>
                                    <option>Like New</option>
                                    <option>Good</option>
                                    <option>Fair</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold mb-2">Price type</label>
                            <div class="d-flex gap-2 p-1 bg-light" style="border-radius: 999px;">
                                <button type="button" class="btn btn-sm w-100 rounded-pill text-white fw-bold" style="background: #8b5cf6;">💰 Sell</button>
                                <button type="button" class="btn btn-sm w-100 rounded-pill fw-bold" style="background: transparent;">🔁 Swap</button>
                                <button type="button" class="btn btn-sm w-100 rounded-pill fw-bold" style="background: transparent;">🎁 Free</button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <input type="text" class="form-control bg-light border-0 px-3 py-2" style="border-radius: 12px;" placeholder="$ e.g. 25">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Pickup location</label>
                            <input type="text" class="form-control bg-light border-0 px-3 py-2" style="border-radius: 12px;" placeholder="e.g. Block L, Hostel, MRT">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-5">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" style="border: 1px solid #e5e7eb;">Save draft</button>
                    <button type="submit" class="btn text-white rounded-pill px-4 fw-bold" style="background: linear-gradient(90deg, #8b5cf6, #ec4899);">Post listing</button>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
