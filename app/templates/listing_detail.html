{% extends "base.html" %}
{% block content %}

<section class="page-shell">
    <div id="listing-detail-root">
        <p class="text-center text-muted mb-0">Loading listing...</p>
    </div>
</section>

<div class="modal fade" id="deleteListingModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content confirm-modal">
            <div class="modal-header">
                <h5 class="modal-title">Delete listing?</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Are you sure you want to delete this listing? It will be hidden from buyers but kept in the database.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete-btn">
                    Soft-delete Listing
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content confirm-modal">
            <div class="modal-header">
                <h5 class="modal-title" id="reportModalLabel">Report Listing</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="reportError" class="alert alert-danger d-none"></div>
                <div id="reportSuccess" class="alert alert-success d-none">
                    Report submitted successfully!
                </div>
                <form id="reportForm">
                    <div class="mb-3">
                        <label for="report_reason" class="form-label">Reason *</label>
                        <select id="report_reason" name="report_reason" class="form-select" required>
                            <option value="">Select a reason...</option>
                            <option value="Counterfeit">Counterfeit</option>
                            <option value="Prohibited item">Prohibited item</option>
                            <option value="Spam">Spam</option>
                            <option value="Inappropriate content">Inappropriate content</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="report_description" class="form-label">Description *</label>
                        <textarea id="report_description" name="report_description" class="form-control" rows="4"
                                  placeholder="Please provide details about the issue..." required></textarea>
                        <div class="form-text">Minimum 10 characters</div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="submitReportBtn">
                    <i class="bi bi-flag"></i> Submit Report
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const LISTING_ID = Number("{{ listing_id }}");
        const root = document.getElementById("listing-detail-root");
        const CURRENT_USER_ID_RAW = "{{ session.get('user_id') or '' }}";
        const CURRENT_USER_ID = CURRENT_USER_ID_RAW ? Number(CURRENT_USER_ID_RAW) : null;

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value == null ? "" : String(value);
            return div.innerHTML;
        }

        function imageList(listing) {
            if (Array.isArray(listing.images) && listing.images.length) {
                return listing.images;
            }
            return listing.imageUrl ? [listing.imageUrl] : [];
        }

        function formatRating(value) {
            if (value == null) return "";
            const number = Number(value);
            return Number.isInteger(number) ? String(number) : String(value);
        }

        function parseTimestamp(value) {
            if (!value) return null;
            const parts = String(value).split(".");
            const millis = parts[1] ? "." + parts[1].slice(0, 3).padEnd(3, "0") : "";
            return new Date(parts[0].replace(" ", "T") + millis + "Z");
        }

        function formatSingaporeTimestamp(value) {
            const date = parseTimestamp(value);
            if (!date || Number.isNaN(date.getTime())) return "";
            return date.toLocaleString("en-SG", {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "numeric",
                minute: "2-digit",
                hour12: true,
                timeZone: "Asia/Singapore",
            }).replace(/\b(am|pm)\b/i, function (match) {
                return match.toUpperCase();
            });
        }

        function avatarMarkup(imageUrl, name, classes) {
            const safeName = escapeHtml(name || "User");
            const initial = safeName.trim().charAt(0).toUpperCase() || "U";
            if (imageUrl) {
                return `<img src="${escapeHtml(imageUrl)}" alt="${safeName}" class="${classes} avatar-img" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name || "User")}&background=030213&color=fff&size=160';">`;
            }
            return `<span class="${classes}">${initial}</span>`;
        }

        function ratingMarkup(sellerRating) {
            if (sellerRating && sellerRating.review_count > 0) {
                return `<small class="text-muted">${escapeHtml(formatRating(sellerRating.average_rating))} <i class="bi bi-star-fill text-warning"></i> average rating &middot; ${sellerRating.review_count} review${sellerRating.review_count !== 1 ? "s" : ""}</small>`;
            }
            return `<small class="text-muted"><i class="bi bi-star text-warning"></i> No reviews yet</small>`;
        }

        function detailMarkup(listing) {
            const images = imageList(listing);
            const seller = listing.seller || {};
            const sellerName = seller.displayName || "Student Seller";
            const isOwner = CURRENT_USER_ID != null && CURRENT_USER_ID === seller.id;
            const timeLabel = listing.lastModifiedTimestamp && listing.lastModifiedTimestamp !== listing.listingDate
                ? `Updated ${formatSingaporeTimestamp(listing.lastModifiedTimestamp)}`
                : `Listed ${formatSingaporeTimestamp(listing.listingDate)}`;

            const imageMarkup = images.map(function (image, index) {
                return `<img src="${escapeHtml(image)}" alt="${escapeHtml(listing.title)}" class="detail-slider-image ${index === 0 ? "active" : ""}">`;
            }).join("");

            const sliderControls = images.length > 1 ? `
                <button type="button" class="detail-slider-arrow detail-slider-left"><i class="bi bi-chevron-left"></i></button>
                <button type="button" class="detail-slider-arrow detail-slider-right"><i class="bi bi-chevron-right"></i></button>
                <span class="detail-image-counter"><span class="detail-current-image-number">1</span> / ${images.length}</span>
            ` : "";

            const ownerActions = isOwner ? `
                <div class="owner-actions mt-4">
                    <a href="/listing/${listing.id}/edit" class="btn btn-outline-dark">
                        <i class="bi bi-pencil"></i> Edit Listing
                    </a>
                    <a href="{{ url_for('offers') }}" class="btn btn-outline-dark">
                        <i class="bi bi-inbox"></i> View Offers
                    </a>
                    <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteListingModal">
                        <i class="bi bi-archive"></i> Delete Listing
                    </button>
                </div>
            ` : "";

            const sellerNameMarkup = seller.id != null
                ? `<a href="/profile/${seller.id}" class="text-dark text-decoration-none">${escapeHtml(sellerName)}</a>`
                : escapeHtml(sellerName);

            const cashOfferMarkup = listing.price !== "Swap Only" ? `
                <hr>
                <h5 class="fw-bold">Submit Cash Offer</h5>
                <label for="cash_offer_amount" class="form-label">Cash offer</label>
                <div class="input-group mb-3">
                    <span class="input-group-text">$</span>
                    <input id="cash_offer_amount" type="number" class="form-control" placeholder="20" min="0" step="0.01">
                </div>
                <button id="submit-cash-btn" type="button" class="btn btn-accent w-100 mb-3">
                    <i class="bi bi-cash-coin"></i> Submit Cash Offer
                </button>
                <hr>
            ` : "<hr>";

            return `
                <a href="{{ url_for('index') }}" class="back-link"><i class="bi bi-arrow-left"></i> Back to listings</a>
                <div class="row g-4 mt-1">
                    <div class="col-lg-7">
                        <div class="detail-media detail-image-slider">
                            ${imageMarkup}
                            ${sliderControls}
                            <span class="listing-badge badge-verified">Available</span>
                        </div>
                        <div class="page-card mt-4">
                            <div class="d-flex justify-content-between gap-3 flex-wrap">
                                <div>
                                    <span class="condition-tag">${escapeHtml(listing.category)}</span>
                                    <h1 class="detail-title mt-3">${escapeHtml(listing.title)}</h1>
                                </div>
                                <h2 class="detail-price">${escapeHtml(listing.price)}</h2>
                            </div>
                            <p class="text-muted">
                                <i class="bi bi-geo-alt"></i> NYP Campus &middot;
                                ${escapeHtml(timeLabel)} &middot;
                                <span class="condition-tag">${escapeHtml(listing.condition)}</span>
                            </p>
                            <hr>
                            <h5 class="fw-bold">Description</h5>
                            <p class="text-muted mb-0">${escapeHtml(listing.description)}</p>
                            ${ownerActions}
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <aside class="page-card sticky-card">
                            <h5 class="fw-bold mb-3">Seller Contact</h5>
                            <div class="seller-profile">
                                ${avatarMarkup(seller.profileImageUrl, sellerName, "avatar-mini")}
                                <div>
                                    <h6 class="mb-0 fw-bold">${sellerNameMarkup}</h6>
                                    ${ratingMarkup(listing.sellerRating)}
                                </div>
                            </div>
                            <div class="info-list mt-3">
                                <div><i class="bi bi-envelope"></i> ${escapeHtml(seller.email)}</div>
                                <div><i class="bi bi-telephone"></i> ${escapeHtml(seller.contactNumber)}</div>
                                <div><i class="bi bi-shield-check"></i> Verified NYP student</div>
                            </div>
                            <hr>
                            <div id="offer-feedback" class="alert d-none mb-3" role="alert"></div>
                            ${cashOfferMarkup}
                            <h5 class="fw-bold">Submit Swap Offer</h5>
                            <label for="swap_listing_id" class="form-label">Swap with my listing</label>
                            <select id="swap_listing_id" class="form-select mb-3">
                                <option value="">Select an existing listing</option>
                            </select>
                            <label for="offer_message" class="form-label">Message</label>
                            <textarea id="offer_message" rows="3" class="form-control mb-3"
                                placeholder="Can meet at LRC tomorrow?"></textarea>
                            <button id="submit-swap-btn" type="button" class="btn btn-outline-dark w-100">
                                <i class="bi bi-arrow-left-right"></i> Submit Swap Offer
                            </button>
                            <button class="btn btn-outline-danger w-100 mt-3" data-bs-toggle="modal"
                                data-bs-target="#reportModal"><i class="bi bi-flag"></i> Report Listing</button>
                        </aside>
                    </div>
                </div>
            `;
        }

        function activateSlider() {
            const images = document.querySelectorAll(".detail-slider-image");
            const prevBtn = document.querySelector(".detail-slider-left");
            const nextBtn = document.querySelector(".detail-slider-right");
            const counter = document.querySelector(".detail-current-image-number");
            let currentIndex = 0;

            function showImage(index) {
                images.forEach(function (img) { img.classList.remove("active"); });
                images[index].classList.add("active");
                if (counter) counter.textContent = index + 1;
            }

            if (prevBtn) {
                prevBtn.addEventListener("click", function () {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    showImage(currentIndex);
                });
            }
            if (nextBtn) {
                nextBtn.addEventListener("click", function () {
                    currentIndex = (currentIndex + 1) % images.length;
                    showImage(currentIndex);
                });
            }
        }

        function activateOfferHandlers() {
            const feedback = document.getElementById("offer-feedback");
            const deleteBtn = document.getElementById("confirm-delete-btn");

            if (deleteBtn) {
                deleteBtn.addEventListener("click", async function () {
                    deleteBtn.disabled = true;
                    deleteBtn.textContent = "Deleting...";

                    try {
                        const res = await fetch(`/api/listings/${LISTING_ID}`, {
                            method: "DELETE",
                            headers: {
                                "Content-Type": "application/json"
                            }
                        });

                        const data = await res.json();

                        if (!res.ok) {
                            throw new Error(data.error || "Failed to delete listing.");
                        }

                        window.location.href = "{{ url_for('index') }}";
                    } catch (err) {
                        alert(err.message);
                        deleteBtn.disabled = false;
                        deleteBtn.textContent = "Soft-delete Listing";
                    }
                });
            }

            function showFeedback(message, isError) {
                feedback.textContent = message;
                feedback.className = "alert mb-3 " + (isError ? "alert-danger" : "alert-success");
                feedback.classList.remove("d-none");
                feedback.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }

            async function postOffer(payload) {
                const res = await fetch("/api/offers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || "Something went wrong.");
                return data;
            }

            const cashBtn = document.getElementById("submit-cash-btn");
            if (cashBtn) {
                cashBtn.addEventListener("click", async function () {
                    const price = parseFloat(document.getElementById("cash_offer_amount").value);
                    if (isNaN(price) || price < 0) {
                        showFeedback("Please enter a valid cash amount.", true);
                        return;
                    }
                    cashBtn.disabled = true;
                    try {
                        const data = await postOffer({
                            listingId: LISTING_ID,
                            offerType: "cash",
                            proposedPrice: price,
                        });
                        showFeedback(data.message || "Cash offer submitted!", false);
                        document.getElementById("cash_offer_amount").value = "";
                    } catch (err) {
                        showFeedback(err.message, true);
                    } finally {
                        cashBtn.disabled = false;
                    }
                });
            }

            const swapSelect = document.getElementById("swap_listing_id");
            if (swapSelect) {
                fetch("/api/my-listings")
                    .then(function (r) { return r.json(); })
                    .then(function (listings) {
                        listings.forEach(function (l) {
                            if (l.id === LISTING_ID) return;
                            const opt = document.createElement("option");
                            opt.value = l.id;
                            opt.textContent = l.title;
                            swapSelect.appendChild(opt);
                        });
                    })
                    .catch(function () { });
            }

            const swapBtn = document.getElementById("submit-swap-btn");
            if (swapBtn) {
                swapBtn.addEventListener("click", async function () {
                    const swapId = parseInt(swapSelect.value, 10);
                    if (!swapId) {
                        showFeedback("Please select one of your listings to swap.", true);
                        return;
                    }
                    swapBtn.disabled = true;
                    try {
                        const data = await postOffer({
                            listingId: LISTING_ID,
                            offerType: "swap",
                            swapListingId: swapId,
                        });
                        showFeedback(data.message || "Swap offer submitted!", false);
                        swapSelect.value = "";
                        document.getElementById("offer_message").value = "";
                    } catch (err) {
                        showFeedback(err.message, true);
                    } finally {
                        swapBtn.disabled = false;
                    }
                });
            }

            const reportBtn = document.getElementById("submitReportBtn");
            const reportError = document.getElementById("reportError");
            const reportSuccess = document.getElementById("reportSuccess");

            if (reportBtn) {
                reportBtn.addEventListener("click", async function () {
                    reportError.classList.add("d-none");
                    reportSuccess.classList.add("d-none");

                    const reason = document.getElementById("report_reason").value;
                    const description = document.getElementById("report_description").value.trim();

                    if (!reason) {
                        reportError.textContent = "Please select a reason.";
                        reportError.classList.remove("d-none");
                        return;
                    }

                    if (!description || description.length < 10) {
                        reportError.textContent = "Description must be at least 10 characters.";
                        reportError.classList.remove("d-none");
                        return;
                    }

                    reportBtn.disabled = true;
                    reportBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Submitting...';

                    try {
                        const response = await fetch(`/api/listings/${LISTING_ID}/reports`, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            credentials: "same-origin",
                            body: JSON.stringify({
                                reason: reason,
                                description: description
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.error || "Failed to submit report.");
                        }

                        reportSuccess.textContent = data.message || "Report submitted successfully!";
                        reportSuccess.classList.remove("d-none");

                        document.getElementById("reportForm").reset();
                        setTimeout(() => {
                            const modal = bootstrap.Modal.getInstance(document.getElementById("reportModal"));
                            if (modal) modal.hide();
                            reportBtn.disabled = false;
                            reportBtn.innerHTML = '<i class="bi bi-flag"></i> Submit Report';
                        }, 2000);

                    } catch (err) {
                        reportError.textContent = err.message;
                        reportError.classList.remove("d-none");
                        reportBtn.disabled = false;
                        reportBtn.innerHTML = '<i class="bi bi-flag"></i> Submit Report';
                    }
                });
            }

            document.getElementById("reportModal")?.addEventListener("hidden.bs.modal", function () {
                if (!reportBtn) return;
                reportBtn.disabled = false;
                reportBtn.innerHTML = '<i class="bi bi-flag"></i> Submit Report';
                reportError.classList.add("d-none");
                reportSuccess.classList.add("d-none");
                document.getElementById("reportForm")?.reset();
            });
        }

        fetch(`/api/listings/${LISTING_ID}`)
            .then(function (response) {
                if (response.status === 401) {
                    window.location.href = "{{ url_for('login') }}";
                    return null;
                }
                if (!response.ok) {
                    return response.json().then(function (data) {
                        throw new Error(data.error || "This listing does not exist or is no longer available.");
                    });
                }
                return response.json();
            })
            .then(function (data) {
                if (!data) return;
                root.innerHTML = detailMarkup(data.listing);
                activateSlider();
                activateOfferHandlers();
            })
            .catch(function (err) {
                root.innerHTML = `<div class="alert alert-danger" role="alert">${escapeHtml(err.message)}</div>`;
            });
    });
</script>
{% endblock %}
