[tool:pytest]
testpaths = tests
pythonpath = .

[coverage:run]
source = app

[coverage:report]
show_missing = True
skip_empty = True

[pylint.MASTER]
ignore=.venv,venv,__pycache__

[pylint.FORMAT]
max-line-length=120

[pylint.DESIGN]
max-args=8
max-locals=20
max-branches=12
max-statements=40

[pylint.MESSAGES CONTROL]
disable=
    missing-module-docstring,
    missing-class-docstring,
    too-few-public-methods,
    broad-exception-caught,
    duplicate-code