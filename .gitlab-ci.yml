image: python:3.11-bookworm

stages:
  - validate
  - test
  - ui-test
  - api-test
  - security
  - security-gate
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PYLINT_FAIL_UNDER: "10.0"
  UNIT_COVERAGE_MIN: "75"

cache:
  key:
    files:
      - requirements.txt
      - requirements-dev.txt
  paths:
    - .cache/pip

.python_setup:
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements-dev.txt

pylint-application:
  stage: validate
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running pylint on application, scripts, and test code."
    - python -m pylint app tests scripts --fail-under="$PYLINT_FAIL_UNDER" | tee reports/pylint-report.txt
    - echo "Recording cyclomatic complexity report."
    - python -m radon cc app/ -s | tee reports/radon-cc-report.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/pylint-report.txt
      - reports/radon-cc-report.txt
  allow_failure: false

code-quality-gate:
  stage: validate
  extends: .python_setup
  script:
    - mkdir -p reports
    - python scripts/code_quality_gate.py | tee reports/code-quality-gate.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/code-quality-gate.txt
  allow_failure: false

pytest-unit-tests:
  stage: test
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running unit tests with coverage."
    - python -m pytest tests/unit/ --junitxml=reports/unit-tests.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term-missing --cov-fail-under="$UNIT_COVERAGE_MIN"
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/unit-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths:
      - reports/unit-tests.xml
      - reports/coverage.xml
  allow_failure: false

pytest-api-tests:
  stage: test
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running supporting Pytest API tests."
    - python -m pytest tests/api/ --junitxml=reports/api-tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/api-tests.xml
    paths:
      - reports/api-tests.xml
  allow_failure: false

selenium-ui-tests:
  stage: ui-test
  extends: .python_setup
  services:
    - name: selenium/standalone-chrome:4.27.0
      alias: selenium
  variables:
    SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
  script:
    - mkdir -p reports
    - echo "Waiting for Selenium Chrome service."
    - |
      python - <<'PY'
      import time
      import urllib.request

      url = "http://selenium:4444/status"

      for attempt in range(30):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  print(response.read().decode()[:300])
                  break
          except Exception as error:
              print(f"Waiting for Selenium service... {attempt + 1}/30: {error}")
              time.sleep(2)
      else:
          raise SystemExit("Selenium service did not become ready.")
      PY
    - echo "Running Flask UI and Selenium tests."
    - python -m pytest tests/ui/ --junitxml=reports/ui-tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/ui-tests.xml
    paths:
      - reports/ui-tests.xml
  allow_failure: false

newman-api-tests:
  stage: api-test
  image: node:20-bookworm-slim
  before_script:
    - npm install -g newman newman-reporter-htmlextra
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3 python3-pip python3-venv
    - python3 -m venv .venv-newman
    - . .venv-newman/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - mkdir -p reports
    - rm -f swaplah.db
    - export FLASK_DEBUG=0
    - python -m flask --app run:app run --host 0.0.0.0 --port 5000 > reports/flask-newman.log 2>&1 &
    - |
      python - <<'PY'
      import time
      import urllib.request

      url = "http://127.0.0.1:5000/api/health"

      for attempt in range(30):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  print(f"Flask app ready with status {response.status}")
                  break
          except Exception as error:
              print(f"Waiting for Flask app... {attempt + 1}/30: {error}")
              time.sleep(2)
      else:
          raise SystemExit("Flask app did not become ready.")
      PY
  script:
    - newman run postman/swaplah-api-tests.postman_collection.json
        --environment postman/swaplah-ci.postman_environment.json
        --reporters cli,junit,htmlextra
        --reporter-junit-export reports/newman-junit.xml
        --reporter-htmlextra-export reports/newman-report.html
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/newman-junit.xml
    paths:
      - reports/newman-junit.xml
      - reports/newman-report.html
      - reports/flask-newman.log
  allow_failure: false

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

semgrep-sast:
  stage: security
  allow_failure: false

secret_detection:
  stage: security
  allow_failure: false

gemnasium-python-dependency_scanning:
  stage: security
  variables:
    PIP_REQUIREMENTS_FILE: "requirements.txt"
  artifacts:
    when: always
    reports:
      dependency_scanning: gl-dependency-scanning-report.json
    paths:
      - gl-dependency-scanning-report.json
      - gl-sbom-*.cdx.json
  allow_failure: false

cyclonedx-sbom:
  stage: security
  extends: .python_setup
  script:
    - python scripts/generate_sbom.py -r requirements.txt -r requirements-dev.txt -o swaplah-sbom.cdx.json
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      cyclonedx: swaplah-sbom.cdx.json
    paths:
      - swaplah-sbom.cdx.json
  allow_failure: false

security-gate:
  stage: security-gate
  image: python:3.11-slim

  needs:
    - job: semgrep-sast
      artifacts: true

    - job: gemnasium-python-dependency_scanning
      artifacts: true

    - job: secret_detection
      artifacts: true

  script:
    - echo "Checking GitLab security reports..."
    - python scripts/security_gate.py

  allow_failure: false

build-archive:
  stage: build
  extends: .python_setup
  script:
    - python scripts/build_package.py -o dist/swaplah-build.zip
  artifacts:
    paths:
      - dist/swaplah-build.zip
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - when: never

deploy-package:
  stage: deploy
  image: curlimages/curl:latest
  needs:
    - job: build-archive
      artifacts: true
  script:
    - test -f dist/swaplah-build.zip
    - >
      curl
      --fail
      --show-error
      --location
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}"
      --upload-file dist/swaplah-build.zip
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/swaplah/${CI_COMMIT_SHORT_SHA}/swaplah-build.zip"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never