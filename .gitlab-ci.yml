image: python:3.11-bookworm

stages:
  - validate
  - test
  - ui-test
  - api-test
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"
  PYLINT_FAIL_UNDER: "7.0"
  UNIT_COVERAGE_MIN: "75"

cache:
  key:
    files:
      - requirements.txt
  paths:
    - .cache/pip

.python_setup:
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

pylint-application:
  stage: validate
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running pylint on application and test code."
    - python -m pylint app tests --fail-under="$PYLINT_FAIL_UNDER" | tee reports/pylint-report.txt
    - echo "Checking cyclomatic complexity."
    - python -m radon cc app/ -s
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - reports/pylint-report.txt
  allow_failure: false

pytest-unit-tests:
  stage: test
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running unit tests with coverage."
    - python -m pytest tests/unit/ --junitxml=reports/unit-tests.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term-missing --cov-fail-under="$UNIT_COVERAGE_MIN"
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?%)$/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/unit-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths:
      - reports/unit-tests.xml
      - reports/coverage.xml
  allow_failure: false

pytest-api-tests:
  stage: test
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running supporting Pytest API tests."
    - python -m pytest tests/api/ --junitxml=reports/api-tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/api-tests.xml
    paths:
      - reports/api-tests.xml
  allow_failure: false

selenium-ui-tests:
  stage: ui-test
  extends: .python_setup
  services:
    - name: selenium/standalone-chrome:4.27.0
      alias: selenium
  variables:
    SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
  script:
    - mkdir -p reports
    - echo "Waiting for Selenium Chrome service."
    - |
      python - <<'PY'
      import time
      import urllib.request

      url = "http://selenium:4444/status"

      for attempt in range(30):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  print(response.read().decode()[:300])
                  break
          except Exception as error:
              print(f"Waiting for Selenium service... {attempt + 1}/30: {error}")
              time.sleep(2)
      else:
          raise SystemExit("Selenium service did not become ready.")
      PY
    - echo "Running Flask UI and Selenium tests."
    - python -m pytest tests/ui/ --junitxml=reports/ui-tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/ui-tests.xml
    paths:
      - reports/ui-tests.xml
  allow_failure: false

newman-api-tests:
  stage: api-test
  image: node:18-bookworm-slim
  before_script:
    - npm install -g newman newman-reporter-htmlextra
    - apt-get update -qq
    - apt-get install -y --no-install-recommends python3 python3-pip python3-venv
    - python3 -m venv .venv-newman
    - . .venv-newman/bin/activate
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - mkdir -p reports
    - rm -f swaplah.db
    - export FLASK_DEBUG=0
    - python -m flask --app run:app run --host 0.0.0.0 --port 5000 > reports/flask-newman.log 2>&1 &
    - |
      python - <<'PY'
      import time
      import urllib.request

      url = "http://127.0.0.1:5000/"

      for attempt in range(30):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  print(f"Flask app ready with status {response.status}")
                  break
          except Exception as error:
              print(f"Waiting for Flask app... {attempt + 1}/30: {error}")
              time.sleep(2)
      else:
          raise SystemExit("Flask app did not become ready.")
      PY
  script:
    - newman run postman/swaplah-api-tests.postman_collection.json
        --environment postman/swaplah-ci.postman_environment.json
        --reporters cli,junit,htmlextra
        --reporter-junit-export reports/newman-junit.xml
        --reporter-htmlextra-export reports/newman-report.html
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/newman-junit.xml
    paths:
      - reports/newman-junit.xml
      - reports/newman-report.html
      - reports/flask-newman.log
  allow_failure: false

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

semgrep-sast:
  stage: security
  allow_failure: false

secret_detection:
  stage: security
  allow_failure: false

gemnasium-python-dependency_scanning:
  stage: security
  allow_failure: false
