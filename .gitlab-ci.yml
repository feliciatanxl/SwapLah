image: python:3.10-slim

stages:
  - lint
  - test
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# Python setup only for our own app jobs.
# Do NOT use global before_script because GitLab security images may not have Python.
.python_setup:
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

# ==========================================
# STAGE 1: LINTING & CODE QUALITY
# ==========================================
linting_job:
  stage: lint
  extends: .python_setup
  script:
    - pip install pylint radon
    - echo "Running Pylint (Must score >= 7.0)..."
    - pylint app/ --fail-under=7.0
    - echo "Checking Cyclomatic Complexity (Must be <= 10)..."
    - radon cc app/ -nc --total-average
  allow_failure: false

# ==========================================
# STAGE 2: AUTOMATED TESTING
# ==========================================
unit_testing_job:
  stage: test
  extends: .python_setup
  script:
    - pip install pytest pytest-cov
    - echo "Running Unit Tests (Must have >= 60% coverage)..."
    - pytest tests/unit/ --cov=app/ --cov-fail-under=60

api_testing_job:
  stage: test
  extends: .python_setup
  script:
    - pip install pytest requests
    - echo "Running API Endpoint Tests..."
    - pytest tests/api/

ui_testing_job:
  stage: test
  extends: .python_setup
  script:
    - pip install pytest selenium
    - echo "Running Selenium UI Tests..."
    - pytest tests/ui/

# ==========================================
# STAGE 3: SECURITY SCANS
# ==========================================
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Dependency scanning can sometimes fail due to analyzer issues.
# Keep it running for evidence, but don't block the whole pipeline.
gemnasium-python-dependency_scanning:
  allow_failure: true