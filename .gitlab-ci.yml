image: python:3.11-bookworm

stages:
  - lint
  - test
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONPATH: "$CI_PROJECT_DIR"

cache:
  paths:
    - .cache/pip

.python_setup:
  before_script:
    - python -m venv .venv
    - source .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

linting_job:
  stage: lint
  extends: .python_setup
  script:
    - echo "Running pylint. Minimum required score is 7.0."
    - python -m pylint app tests --fail-under=7.0
    - echo "Checking cyclomatic complexity."
    - python -m radon cc app/ -s
  allow_failure: false

unit_testing_job:
  stage: test
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running unit tests with coverage."
    - python -m pytest tests/unit/ --junitxml=reports/unit-tests.xml --cov=app --cov-report=xml:reports/coverage.xml --cov-report=term-missing --cov-fail-under=75
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/unit-tests.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/coverage.xml
    paths:
      - reports/unit-tests.xml
      - reports/coverage.xml

api_testing_job:
  stage: test
  extends: .python_setup
  script:
    - mkdir -p reports
    - echo "Running API tests."
    - python -m pytest tests/api/ --junitxml=reports/api-tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/api-tests.xml
    paths:
      - reports/api-tests.xml

ui_testing_job:
  stage: test
  extends: .python_setup
  services:
    - name: selenium/standalone-chrome:4.27.0
      alias: selenium
  variables:
    SELENIUM_REMOTE_URL: "http://selenium:4444/wd/hub"
  script:
    - mkdir -p reports
    - echo "Waiting for Selenium Chrome service."
    - |
      python - <<'PY'
      import time
      import urllib.request

      url = "http://selenium:4444/status"

      for attempt in range(30):
          try:
              with urllib.request.urlopen(url, timeout=2) as response:
                  print(response.read().decode()[:300])
                  break
          except Exception as error:
              print(f"Waiting for Selenium service... {attempt + 1}/30: {error}")
              time.sleep(2)
      else:
          raise SystemExit("Selenium service did not become ready.")
      PY
    - echo "Running UI tests."
    - python -m pytest tests/ui/ --junitxml=reports/ui-tests.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: reports/ui-tests.xml
    paths:
      - reports/ui-tests.xml

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

gemnasium-python-dependency_scanning:
  allow_failure: true